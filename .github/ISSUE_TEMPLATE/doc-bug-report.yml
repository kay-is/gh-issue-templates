name: 🐛 Report a documentation bug
description: Report inaccurate, outdated, or broken content in the documentation.
title: "[Bug Report]: "
labels: ["bug"]
type: "Bug"
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a documentation bug!
        Please fill in as much detail as possible so we can fix the issue quickly.

  - type: input
    id: page
    attributes:
      label: Page URL or file path
      description: Link to the documentation page or path to the source file that contains the issue.
      placeholder: "https://docs.ton.org/... or docs/.../file.mdx"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What is wrong?
      description: Describe the inaccurate, outdated, or broken content.
      placeholder: "The code example in the 'Installation' section uses a deprecated flag..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should it say or show instead?
      description: Describe the correct information or provide a suggested fix.
      placeholder: "The correct flag is --install-dir instead of --dir..."
      value: "No suggestions."
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How much does this issue affect readers?
      options:
        - "Low — minor typo or cosmetic issue"
        - "Medium — confusing or misleading content"
        - "High — causes errors or significant misunderstanding"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
